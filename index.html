<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Chat</title>
<style>
  :root{--bg:#f6f5f2;--fg:#1c1b19;--muted:#6f6c66;--panel:#fff;--line:#e2dfd8;--me:#dbe8ff;--ai:#fff;--tool:#f0eee8;--err:#b3261e;--accent:#2b5bd7}
  @media (prefers-color-scheme:dark){:root{--bg:#141414;--fg:#ececec;--muted:#9a9a9a;--panel:#1d1d1d;--line:#2c2c2c;--me:#243a63;--ai:#1d1d1d;--tool:#232323;--err:#ff7b72;--accent:#7aa2ff}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100dvh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .iconbtn{padding:6px 10px;line-height:1}
  #gear.open{background:var(--tool)}
  #settings{display:none;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  #settings.open{display:flex}
  #settings label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  [hidden]{display:none!important}
  #past.open{background:var(--tool)}
  #pastPanel{display:none;flex-direction:column;max-height:60dvh;overflow-y:auto;border-bottom:1px solid var(--line);background:var(--panel)}
  #pastPanel.open{display:flex}
  #pastPanel button{text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 16px;background:none}
  #pastPanel button.cur{background:var(--tool)}
  #pastPanel .t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #pastPanel .d{display:block;font-size:12px;color:var(--muted)}
  #pastPanel .empty{padding:12px 16px;color:var(--muted);font-size:13px}
  header h1{font-size:16px;margin:0;font-weight:600}
  .pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
  header .spacer{flex:1}
  button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button:disabled{opacity:.5;cursor:default}
  #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:min(820px,100%);padding:10px 14px;border-radius:12px;white-space:normal;overflow-wrap:anywhere}
  .me{align-self:flex-end;background:var(--me);white-space:pre-wrap}
  .ai{align-self:flex-start;background:var(--ai);border:1px solid var(--line)}
  .ai.status{color:var(--muted);font-style:italic}
  .ai pre{background:var(--tool);padding:10px;border-radius:8px;overflow-x:auto}
  .ai code{font-size:13px}
  .ai p:first-child{margin-top:0}.ai p:last-child{margin-bottom:0}
  .tool{align-self:flex-start;font-size:12.5px;color:var(--muted);background:var(--tool);border-radius:8px;padding:4px 10px;max-width:min(820px,100%);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
  .tool.err{color:var(--err)}
  .sys{align-self:center;font-size:12px;color:var(--muted)}
  .error{align-self:flex-start;color:var(--err);font-size:13px}
  form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel)}
  textarea{flex:1;resize:none;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);min-height:44px;max-height:200px}
  #mic.listening{background:#d33;color:#fff;border-color:#d33;animation:pulse 1s infinite}
  #mic.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  /* Conversation button shows a small Astrid orb (Mike 11/4); the plain mic is dictation only */
  #mic{padding:6px 9px;display:flex;align-items:center;justify-content:center}
  .orbIcon{display:block;width:22px;height:22px;border-radius:50%;
    background:radial-gradient(circle,#fff 0,#e6f9ff 18%,#2fe6ff 42%,rgba(47,230,255,.45) 62%,rgba(47,230,255,0) 72%);
    box-shadow:0 0 6px 1px rgba(47,230,255,.55)}
  #mic.on .orbIcon{background:radial-gradient(circle,#fff 0,#efe9ff 18%,#8a5cff 42%,rgba(138,92,255,.45) 62%,rgba(138,92,255,0) 72%);box-shadow:0 0 6px 1px rgba(255,255,255,.6)}
  /* Phone layout (Mike 11/4): the message box gets the full width; buttons sit on a row below it */
  #f{flex-wrap:wrap;align-items:flex-end}
  #f textarea{flex:1 1 300px}
  #f .btns{display:flex;gap:8px;align-items:center}
  #f .btns .grow{flex:1}
  @media (max-width:600px){#f textarea{flex-basis:100%}#f .btns{flex:1 1 100%}}
  #f .btns{position:relative}
  #camMenu{position:absolute;bottom:calc(100% + 6px);left:0;z-index:20;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.25);overflow:hidden}
  #camMenu[hidden]{display:none!important}
  #camMenu button{border:0;border-radius:0;text-align:left;padding:12px 18px;white-space:nowrap;border-bottom:1px solid var(--line)}
  #camMenu button:last-child{border-bottom:0}
  #att{display:flex;flex-wrap:wrap;gap:6px;width:100%}
  #att:empty{display:none}
  #att .chip{position:relative;width:56px;height:56px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--tool)}
  #att .chip img,#att .chip video{width:100%;height:100%;object-fit:cover}
  #att .chip button{position:absolute;top:2px;right:2px;padding:0 5px;font-size:12px;line-height:16px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;border:0}
  #att .chip .tag{position:absolute;left:3px;bottom:2px;font-size:10px;color:#fff;text-shadow:0 0 3px #000}
  .me .thumbs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
  .me .thumbs img,.me .thumbs video{width:72px;height:72px;object-fit:cover;border-radius:6px}
  #dict.listening{background:#d33;color:#fff;border-color:#d33;animation:pulse 1s infinite}
  /* Conversation overlay: the orb, a caption and controls; shown only in conversation mode */
  #orbWrap{position:fixed;inset:0;z-index:50;background:#03050a;display:flex;flex-direction:column;align-items:center;color:#dfe8f5}
  #orb{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation;cursor:pointer}
  #orbUi{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 18px;padding-bottom:max(18px,env(safe-area-inset-bottom));pointer-events:none}
  #orbState{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
  #orbCap{max-width:min(680px,100%);max-height:22dvh;overflow-y:auto;text-align:center;font-size:16px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;pointer-events:auto}
  #orbCap.reply{opacity:.85;font-size:15px}
  #orbUi .orbBtns{display:flex;gap:12px;pointer-events:auto}
  #orbUi button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#eef4ff;border-radius:999px;padding:10px 20px}
  #orbTalk.listening{background:#d33;border-color:#d33}
  select.pill{font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--fg)}
  #voiceSel{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);max-width:140px}
  @keyframes pulse{50%{opacity:.6}}
  .cursor::after{content:"▍";animation:blink 1s steps(2) infinite;color:var(--muted)}
  @keyframes blink{to{visibility:hidden}}
</style>
</head>
<body>
<header>
  <h1 id="appTitle">Claude Chat</h1>
  <span class="spacer"></span>
  <button id="stop" hidden>Stop</button>
  <button id="past" title="Past chats" aria-label="Past chats" aria-expanded="false">Past</button>
  <button id="new">New chat</button>
  <button id="gear" class="iconbtn" title="Settings" aria-label="Settings" aria-expanded="false">⚙</button>
</header>
<div id="settings">
  <label>Model <select id="modelSel" class="pill" title="Model for the next message">
    <option value="claude-fable-5-1">Fable 5.1</option>
    <option value="claude-opus-5-5">Opus 5.5</option>
    <option value="claude-sonnet-5-5">Sonnet 5.5</option>
    <option value="claude-opus-5">Opus 5</option>
    <option value="claude-sonnet-5">Sonnet 5</option>
    <option value="claude-haiku-4-5-20251001">Haiku 4.5</option>
  </select></label>
  <label>Effort <select id="effortSel" class="pill" title="Effort for the next message">
    <option value="low">low</option><option value="medium">medium</option><option value="high">high</option><option value="xhigh">xhigh</option><option value="max">max</option>
  </select></label>
  <label>Voice <select id="voiceSel" title="Which voice speaks in conversation mode"><option value="browser">Browser voice</option></select></label>
  <span class="pill" id="rl" title="Plan usage: 5-hour / 7-day windows">usage —</span>
</div>
<div id="pastPanel"></div>
<div id="log"></div>
<form id="f">
  <div id="att"></div>
  <textarea id="in" placeholder="Message…" title="Enter to send, Shift+Enter for a new line" rows="1"></textarea>
  <div class="btns">
  <button id="cam" type="button" title="Add a photo or video" aria-label="Add a photo or video">📷</button>
  <input id="camFile" type="file" accept="image/*,video/*" multiple hidden>
  <input id="camPhoto" type="file" accept="image/*" capture="environment" hidden>
  <input id="camVideo" type="file" accept="video/*" capture="environment" hidden>
  <div id="camMenu" hidden><button type="button" data-in="camPhoto">Take a photo</button><button type="button" data-in="camVideo">Record a video</button><button type="button" data-in="camFile">From gallery</button></div>
  <span class="grow"></span>
  <button id="dict" type="button" title="Dictate: speak to type into the box; tap again to stop" aria-label="Dictate">🎤</button>
  <button id="mic" type="button" title="Start a spoken conversation; tap again to end" aria-label="Spoken conversation"><span class="orbIcon"></span></button>
  <button class="primary" id="send" type="submit">Send</button>
  </div>
</form>
<div id="orbWrap" hidden>
  <canvas id="orb" title="Tap to end the conversation" aria-label="End conversation" role="button"></canvas>
  <div id="orbUi">
    <div id="orbState" aria-live="polite"></div>
    <div id="orbCap"></div>
    <div class="orbBtns"><button id="orbTalk" type="button">Talk now</button><button id="orbEnd" type="button">End</button></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const log=document.getElementById('log'),input=document.getElementById('in'),form=document.getElementById('f');
const sendBtn=document.getElementById('send'),stopBtn=document.getElementById('stop'),newBtn=document.getElementById('new');
let sessionId=null,controller=null;
document.getElementById('appTitle').textContent=document.title||'Claude Chat';
const gear=document.getElementById('gear'),settings=document.getElementById('settings');
gear.addEventListener('click',()=>{const o=settings.classList.toggle('open');gear.classList.toggle('open',o);gear.setAttribute('aria-expanded',o);});
try{sessionId=localStorage.getItem('claude-chat-session')||null}catch(e){}

// Model + effort: per-message overrides, persisted; server defaults fill in until chosen.
const modelSel=document.getElementById('modelSel'),effortSel=document.getElementById('effortSel');
function pick(sel,key,val){if(val&&![...sel.options].some(o=>o.value===val)){const o=document.createElement('option');o.value=val;o.textContent=val;sel.appendChild(o);}if(val)sel.value=val;}
try{pick(modelSel,'m',localStorage.getItem('claude-chat-model'));pick(effortSel,'e',localStorage.getItem('claude-chat-effort'));}catch(e){}
// Rebuild the model menu from the server's catalog (newest models first, older ones grouped); the static options are the fallback.
function setModels(models){
  if(!models||!models.length)return;
  const cur=modelSel.value;modelSel.innerHTML='';let older=null;
  for(const m of models){const o=document.createElement('option');o.value=m.id;o.textContent=m.name;
    if(m.section==='main')modelSel.appendChild(o);else{if(!older){older=document.createElement('optgroup');older.label='Older';}older.appendChild(o);}}
  if(older)modelSel.appendChild(older);
  pick(modelSel,'m',cur);
}
fetch('/config').then(r=>r.json()).then(c=>{
  setModels(c.models);
  try{if(!localStorage.getItem('claude-chat-model'))pick(modelSel,'m',c.model);if(!localStorage.getItem('claude-chat-effort'))pick(effortSel,'e',c.effort);}catch(e){pick(modelSel,'m',c.model);pick(effortSel,'e',c.effort);}
}).catch(()=>{});
modelSel.addEventListener('change',()=>{try{localStorage.setItem('claude-chat-model',modelSel.value)}catch(e){}});
effortSel.addEventListener('change',()=>{try{localStorage.setItem('claude-chat-effort',effortSel.value)}catch(e){}});
// ---- Past chats: list sessions this server ran, reopen one and keep going ----
const pastBtn=document.getElementById('past'),pastPanel=document.getElementById('pastPanel');
function whenStr(t){const d=new Date(t*1000),now=new Date();
  return d.toDateString()===now.toDateString()?d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):d.toLocaleDateString([],{month:'short',day:'numeric'})+' '+d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}
function closePast(){pastPanel.classList.remove('open');pastBtn.classList.remove('open');pastBtn.setAttribute('aria-expanded',false);}
pastBtn.addEventListener('click',async()=>{
  if(pastPanel.classList.contains('open'))return closePast();
  pastPanel.classList.add('open');pastBtn.classList.add('open');pastBtn.setAttribute('aria-expanded',true);
  pastPanel.innerHTML='<div class="empty">Loading…</div>';
  try{
    const {sessions}=await (await fetch('/sessions')).json();
    pastPanel.innerHTML='';
    if(!sessions.length){pastPanel.innerHTML='<div class="empty">No past chats yet.</div>';return;}
    for(const s of sessions){
      const b=document.createElement('button');if(s.id===sessionId)b.className='cur';
      const t=document.createElement('span');t.className='t';t.textContent=s.title;
      const d=document.createElement('span');d.className='d';d.textContent=whenStr(s.updated)+(s.last&&s.last!==s.title?' · '+s.last:'');
      b.append(t,d);b.addEventListener('click',()=>{closePast();openSession(s.id);});pastPanel.appendChild(b);
    }
  }catch(e){pastPanel.innerHTML='<div class="empty">Could not load past chats.</div>';}
});
async function openSession(id){
  if(sendBtn.disabled)return;
  stopAudio();sessionId=id;try{localStorage.setItem('claude-chat-session',id)}catch(e){}
  log.innerHTML='';
  try{
    const r=await fetch('/history?id='+encodeURIComponent(id));if(!r.ok)throw new Error('HTTP '+r.status);
    const {messages}=await r.json();
    for(const m of messages){if(m.role==='user')add('msg me',m.text);else{const d=document.createElement('div');d.className='msg ai';render(d,stripEmo(m.text));log.appendChild(d);}}
    add('sys','Picked up this chat. Keep typing to continue it.');
  }catch(e){add('sys','Resumed this chat (earlier messages could not be shown).');}
  scroll();input.focus();
}


function add(cls,text){const d=document.createElement('div');d.className=cls;d.textContent=text;log.appendChild(d);scroll();return d}
function scroll(){log.scrollTop=log.scrollHeight}
function render(el,md){
  if(window.marked){el.innerHTML=marked.parse(md,{breaks:true});}else{el.textContent=md;}
}
function setBusy(b){sendBtn.disabled=b;stopBtn.hidden=!b;input.disabled=b;}

function status(el,text){el.classList.add('status');el.textContent=text;scroll();}
function newBubble(){const d=document.createElement('div');d.className='msg ai cursor';log.appendChild(d);return d;}

// ---- Voice: conversation mode. The mic starts it: listen (recorded in the page, words from uriel's Whisper), auto-send,
// speak the reply (/tts WAV or browser speechSynthesis), listen again. Tap mic/orb/End to stop. ----
const micBtn=document.getElementById('mic');
const synth=window.speechSynthesis||{cancel(){},speak(){},getVoices(){return[]}};
let convo=false,listening=false,replyText='',speakGen=0,curAudio=null,idleRounds=0,synthTalking=false;
const orbWrap=document.getElementById('orbWrap'),orbState=document.getElementById('orbState'),orbCap=document.getElementById('orbCap');
const orbTalk=document.getElementById('orbTalk');

// Optional emotion tag at the start of a reply: [happy] [concerned] [urgent] [neutral].
const EMO_RE=/^\s*\[(happy|concerned|urgent|neutral|silent)\]\s*/i;  // Astrid's tags; [silent] = not addressed to her
const EMO_COL={happy:[255,201,74],concerned:[255,160,46],urgent:[255,59,59],neutral:null};
const EMO_ANY=/\s*\[(happy|concerned|urgent|neutral|silent)\]\s*/gi;  // Astrid repeats the tag after a tool call
function stripEmo(s){if(/^\s*\[[a-z]{0,12}$/i.test(s))return '';return s.replace(EMO_ANY,(m,t,i)=>i===0?'':' ').replace(/^\s+/,'');}
function emoOf(s){const m=EMO_RE.exec(s);return m?m[1].toLowerCase():null;}

function stripMd(s){
  return s.replace(/```[\s\S]*?```/g,' code block omitted. ')
          .replace(/`([^`]*)`/g,'$1').replace(/^#{1,6}\s+/gm,'')
          .replace(/\*\*|__/g,'').replace(/[*_]/g,'')
          .replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/^[-•]\s+/gm,'');
}
// Voice choice: 'browser' = Chrome speechSynthesis; 'astrid' = Astrid's speech service (via /tts);
// anything else = a Piper model served by /tts. The server's default (Astrid when available) wins until one is picked.
const voiceSel=document.getElementById('voiceSel');
let voiceName='browser';
try{voiceName=localStorage.getItem('claude-chat-voice-name')||'browser'}catch(e){}
function voiceLabel(v){return v==='astrid'?'Astrid':v.replace(/-medium$|-low$|-high$/,'').replace('_',' ');}
fetch('/voices').then(r=>r.json()).then(j=>{
  for(const v of j.voices){const o=document.createElement('option');o.value=v;o.textContent=voiceLabel(v);voiceSel.appendChild(o);}
  let stored=null;try{stored=localStorage.getItem('claude-chat-voice-name')}catch(e){}
  if(!stored&&j.default&&j.voices.includes(j.default))voiceName=j.default;
  if(![...voiceSel.options].some(o=>o.value===voiceName))voiceName='browser';
  voiceSel.value=voiceName;
}).catch(()=>{});
voiceSel.addEventListener('change',()=>{voiceName=voiceSel.value;try{localStorage.setItem('claude-chat-voice-name',voiceName)}catch(e){};stopAudio();
  speak('This is the '+voiceSel.options[voiceSel.selectedIndex].textContent+' voice.',true);});

// WebAudio analyser: WAV replies are routed through it so the orb can follow the voice's loudness.
let actx=null,analyser=null,abuf=null;
function unlockAudio(){  // call from a tap: browsers only start an AudioContext on a user gesture
  try{
    if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      actx=new AC();analyser=actx.createAnalyser();analyser.fftSize=512;analyser.connect(actx.destination);abuf=new Uint8Array(analyser.fftSize);}
    if(actx.state==='suspended')actx.resume().catch(()=>{});
  }catch(e){actx=null;analyser=null;}
}
let simT0=0;
function voiceLevel(){
  if(listening)return Mic.level();   // the orb follows Mike's voice while it listens
  if(curAudio&&curAudio._routed&&analyser){
    analyser.getByteTimeDomainData(abuf);let sum=0;
    for(let i=0;i<abuf.length;i++){const v=(abuf[i]-128)/128;sum+=v*v;}
    return Math.min(1,Math.sqrt(sum/abuf.length)*4);
  }
  if(curAudio)return 0.35;   // playing but not routed (AudioContext not running): steady glow
  if(synthTalking){const t=(performance.now()-simT0)/1000;  // browser voice gives no amplitude: gentle simulated pulse
    return 0.3+0.2*Math.sin(t*6.3)*Math.sin(t*2.1+1)+0.08*Math.sin(t*11);}
  return 0;
}

function stopAudio(){speakGen++;if(curAudio){curAudio.pause();curAudio=null;}synthTalking=false;synth.cancel();}
function afterSpeech(){if(convo&&!listening&&!sendBtn.disabled)startListening();}
// Split into sentence-sized chunks so the first one plays while the rest synthesize.
function chunkText(t){
  const parts=t.match(/[^.!?\n]+(?:[.!?]+["')\]]*|\n+|$)/g)||[t];
  const out=[];let cur='';
  for(const p of parts){const q=p.trim();if(!q)continue;
    if(cur&&(cur.length+q.length>220||out.length===0)){out.push(cur);cur='';}
    cur=cur?cur+' '+q:q;}
  if(cur)out.push(cur);return out;
}
function fetchTts(text){return fetch('/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,voice:voiceName})}).then(r=>r.ok?r.blob():null).catch(()=>null);}
// Speaker wake (Mike 2026-11-06): the Surface Go's sound chip powers down after ~10 s of silence and
// clicks/clips the first word when it wakes. After a quiet spell, play 300 ms of silence first.
let lastAudioEnd=0,silentUrl=null;
function silentWav(ms){const rate=22050,n=Math.round(rate*ms/1000),b=new ArrayBuffer(44+n*2),v=new DataView(b);
  const w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i));};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));}
function wakeSpeakers(){if(Date.now()-lastAudioEnd<3000)return Promise.resolve();
  if(!silentUrl)silentUrl=silentWav(300);
  return new Promise(res=>{const a=new Audio(silentUrl);a.onended=res;a.onerror=res;a.play().catch(res);setTimeout(res,800);});}
function playBlob(blob){const g=speakGen;return wakeSpeakers().then(()=>g===speakGen?playBlobNow(blob):null).finally(()=>{lastAudioEnd=Date.now();});}
function playBlobNow(blob){return new Promise(res=>{const a=new Audio(URL.createObjectURL(blob));curAudio=a;
  // Only route through WebAudio when the context is running; a suspended context would mute the reply.

  if(!convo||spEmo==='silent')return;

    const grow=Math.min(1,(now-fadeStart)/400);
    if(state==='listening'){pulse=1.08+.02*Math.sin(t*2.5);churn=1.2;reach=1+.3*grow;corA=70+80*grow;rayA=40+50*grow;flareRate=.5;siteRate=.3;}
    else if(state==='thinking'){pulse=1+.04*Math.sin(t*1.4);churn=3;reach=1.15;corA=130;rayA=60;flareRate=1.3;siteRate=.6;}
    else if(state==='speaking'){pulse=urgent?1+.45*Math.sqrt(level):1+.25*level;churn=1.5+2.5*level;reach=1+.4*level;corA=80+150*level;rayA=40+80*level;flareRate=.2+(urgent?5:3)*level*level;siteRate=.15+.6*level;}
    else{pulse=1+.04*Math.sin(t*1.1);churn=.5;reach=1;corA=60;rayA=35;flareRate=.12;siteRate=.08;}
    if(reduce)flareRate=0;
    const col=cur(now),light=mix(col,WHITE,.35),r=base*pulse;
    // core: white melting into the colour by ~3/4 out, light strong to the limb
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r*1.35);
    for(let i=0;i<11;i++){const u=i/10,wh=Math.pow(Math.max(0,1-u/.75),1.5),al=u<.35?1:Math.pow((1-u)/.65,1.8);g.addColorStop(u,rgba(mix(col,WHITE,wh),al.toFixed(3)));}
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r*1.35,0,TAU);ctx.fill();
    // streamers: each lives a few seconds at a random angle, fades in and out, reborn elsewhere
    const r0=r*.3,rayEnd=r*reach*1.65;
    const rg=ctx.createRadialGradient(cx,cy,0,cx,cy,rayEnd);rg.addColorStop(0,rgba(light,1));rg.addColorStop(.55,rgba(light,.53));rg.addColorStop(1,rgba(light,0));
    ctx.strokeStyle=rg;ctx.lineCap='round';
    for(let i=0;i<RAYS;i++){let p=(now-stBorn[i])/1000/stLife[i];
      if(!stBorn[i]||p>=1){stBorn[i]=now-(stBorn[i]?0:R()*4000);stLife[i]=(2+3*R())/Math.max(.5,churn);rayAng[i]=TAU*R();rayW[i]=.02+.04*R();p=Math.min(.99,(now-stBorn[i])/1000/stLife[i]);}
      const env=Math.sin(Math.PI*p),n=wave(t*churn*.6,rayF1[i],rayP1[i],rayF2[i],rayP2[i]);
      const an=rayAng[i]+.15*p,len=r*reach*(1+.6*n*env),ca=Math.cos(an),sa=Math.sin(an);
      ctx.globalAlpha=Math.max(0,rayA*env*(.4+.6*n)/255);ctx.lineWidth=rayW[i]*(r0+len)/2;
      ctx.beginPath();ctx.moveTo(cx+r0*ca,cy+r0*sa);ctx.lineTo(cx+len*ca,cy+len*sa);ctx.stroke();}
    // corona: large dim overlapping blobs boiling around the core's edge
    sprite(light);
    const drift=(t*.04)%TAU;
    for(let i=0;i<CORONA;i++){const n=wave(t*churn,corF1[i],corP1[i],corF2[i],corP2[i]),an=corAng[i]+(i%2?-drift:drift),d=r*reach*(.7+.3*n);
      blob(cx+d*Math.cos(an),cy+d*Math.sin(an),r*(.35+.2*n),corA*.4*(.25+.75*n));}
    // limb: active sites rise at random, live 8-20 s, and fade
    const loopGain=state==='speaking'?1+.8*level:state==='listening'?1+.2*grow:1;
    let anySite=false;for(let s=0;s<SITES;s++)if(siBorn[s])anySite=true;
    if(!anySite||R()<siteRate*dt){for(let s=0;s<SITES;s++){if(siBorn[s])continue;siBorn[s]=now;siLife[s]=8+12*R();siAng[s]=TAU*R();siSpan[s]=.08+.2*R();buildEruption(s);break;}}
    const rot=(t*.03)%TAU,limb=r*.62;
    const wg=ctx.createRadialGradient(cx,cy,0,cx,cy,limb*1.9);wg.addColorStop(0,rgba(light,1));wg.addColorStop(.5,rgba(light,1));wg.addColorStop(.7,rgba(light,.44));wg.addColorStop(1,rgba(light,0));
    ctx.strokeStyle=wg;
    // wisps: a fine fringe all round, longer and brighter near active sites
    ctx.lineCap='butt';
    for(let i=0;i<WISPS;i++){const an=wAng[i]+rot,act=activity(an,rot,now),n=wave(t*churn*.5,wF1[i],wP1[i],wF2[i],wP2[i]);
      const len=limb*reach*(.2+.3*n+.6*act),tilt=wTilt[i]+.08*Math.sin(t*.7*churn+wP1[i]),rs=limb*.85,re=rs+len,ae=an+tilt*len/limb;
      ctx.globalAlpha=Math.min(1,corA*(.15+.4*n+.9*act)/255);ctx.lineWidth=wW[i]*(1+act)*.8;
      ctx.beginPath();ctx.moveTo(cx+rs*Math.cos(an),cy+rs*Math.sin(an));ctx.lineTo(cx+re*Math.cos(ae),cy+re*Math.sin(ae));ctx.stroke();}
    // eruptions: strands grow out from the limb, waver a little, and fade
    ctx.lineCap='round';
    for(let s=0;s<SITES;s++){if(!siBorn[s])continue;const p=(now-siBorn[s])/1000/siLife[s];if(p>=1){siBorn[s]=0;continue;}
      const reveal=Math.min(1,p/.3),env=p<.6?1:(1-p)/.4;
      for(let k=0;k<siN[s];k++){const o0=k*SP,segs=Math.max(1,Math.floor(reveal*(SP-1))),plume=stPlume[s][k];
        ctx.beginPath();
        for(let j=0;j<=segs;j++){const rel=stR[s][o0+j]-.95,rr=limb*(.95+rel*loopGain*(plume?.5+.8*p:1));
          const an=siAng[s]+rot+stA[s][o0+j]+.012*Math.sin(t*1.7*churn+stPh[s][k]+j*.6);
          const x=cx+rr*Math.cos(an),y=cy+rr*Math.sin(an);if(j)ctx.lineTo(x,y);else ctx.moveTo(x,y);}
        const flick=.7+.3*Math.sin(t*3*churn+stPh[s][k]);
        ctx.lineWidth=Math.max(.6,base*.006*stW[s][k]);ctx.globalAlpha=Math.min(1,corA*1.8*stB[s][k]*env*flick/255);ctx.stroke();}}
    // flares: erupt at random (mostly from an active site), curl as they drift out, fade
    if(R()<flareRate*dt){for(let i=0;i<FLARES;i++){if(flBorn[i])continue;const fast=state==='thinking';
      flBorn[i]=now;flLife[i]=fast?.8+.6*R():1.3+R();flAng[i]=TAU*R();
      for(let s=0;s<SITES;s++)if(siBorn[s]&&R()<.6){flAng[i]=siAng[s]+rot+(R()-.5)*.15;break;}
      flCurl[i]=(R()-.5)*.6;flSize[i]=.6+.7*R()+(state==='speaking'?.5*level:0);break;}}
    for(let i=0;i<FLARES;i++){if(!flBorn[i])continue;const p=(now-flBorn[i])/1000/flLife[i];if(p>=1){flBorn[i]=0;continue;}
      const out=1-(1-p)*(1-p),fade=(1-p)*(1-p);
      for(let k=0;k<3;k++){const q=Math.max(0,out-.08*k),an=flAng[i]+flCurl[i]*q,d=r*(.9+.85*q);
        blob(cx+d*Math.cos(an),cy+d*Math.sin(an),r*.2*flSize[i]*(1-.25*k)*(.7+.6*p),200*fade*(1-.3*k));}}
    ctx.globalAlpha=1;
  }
  function start(fn){getLevel=fn||(()=>0);if(raf)return;last=0;resize();raf=requestAnimationFrame(frame);}
  function stop(){if(raf)cancelAnimationFrame(raf);raf=0;tint=null;urgent=false;state='idle';from=to=COL.idle;}
  return {start,stop,setState,setTint};
})();

async function send(text,items){
  try{localStorage.setItem('claude-chat-last',String(Date.now()))}catch(e){}
  spReset();replyText='';
  const meB=add('msg me',items&&items.length?text.replace(/\n\n\[Attached[\s\S]*$/,''):text);
  if(items&&items.length){const th=document.createElement('div');th.className='thumbs';
    for(const a of items){const v=a.file.type.startsWith('video/');const m=document.createElement(v?'video':'img');m.src=a.url;if(v){m.muted=true;m.controls=true;m.playsInline=true;}th.append(m);}
    meB.prepend(th);}
  if(convo){orbSet('thinking');orbCap.className='';orbCap.textContent=text;}
  let ai=newBubble(),buf='',t0=Date.now(),gotDone=false;
  status(ai,'Working…');
  const tick=setInterval(()=>{if(ai.classList.contains('status')){const s=Math.round((Date.now()-t0)/1000);ai.textContent=ai.textContent.replace(/( · \d+s)?$/,` · ${s}s`);}},1000);
  setBusy(true);controller=new AbortController();
  try{
    const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text,session_id:sessionId,model:modelSel.value,effort:effortSel.value,voice:convo}),signal:controller.signal});
    if(!r.ok){throw new Error('HTTP '+r.status)}
    const reader=r.body.getReader(),dec=new TextDecoder();let rest='';
    while(true){
      const {value,done}=await reader.read();if(done)break;
      rest+=dec.decode(value,{stream:true});
      const parts=rest.split('\n\n');rest=parts.pop();
      for(const p of parts){
        if(!p.startsWith('data: '))continue;
        const ev=JSON.parse(p.slice(6));
        if(ev.type==='started'){status(ai,'Working…');}
        else if(ev.type==='thinking'){/* thinking stays hidden */}
        else if(ev.type==='text'){
          if(ai.classList.contains('status')){ai.classList.remove('status');ai.textContent='';}
          buf+=ev.text;replyText+=ev.text;spText(ev.text);render(ai,stripEmo(buf));scroll();
        }
        else if(ev.type==='tool'){
          // Tool use stays hidden: close any text so far and show one quiet placeholder.
          spTool();
          if(buf){ai.classList.remove('cursor');ai=newBubble();buf='';status(ai,'Working…');}
        }
        else if(ev.type==='block_end'){spFlush();}   // tablet flushes at every content_block_stop
        else if(ev.type==='tool_input'){/* hidden */}
        else if(ev.type==='tool_result'){
          // hidden; keep the pending bubble at the bottom
          log.appendChild(ai);
        }
        else if(ev.type==='rl'){const f=Math.round((ev.five_hour||0)*100),s=Math.round((ev.seven_day||0)*100);document.getElementById('rl').textContent=`usage 5h ${f}% · 7d ${s}%`;}
        else if(ev.type==='error'){add('error',ev.text);}
        else if(ev.type==='done'){
          gotDone=true;
          if(ev.session_id){sessionId=ev.session_id;try{localStorage.setItem('claude-chat-session',sessionId)}catch(e){}}
          if(ev.is_error&&ev.error){add('error',ev.error);}
        }
      }
    }
    if(gotDone) spFlush();
    if(!gotDone) add('error','Connection ended before Claude finished (no result event). Check the server log.');
  }catch(e){ if(e.name==='AbortError') add('sys','Stopped.'); else add('error',String(e)); }
  finally{
    clearInterval(tick);
    for(const el of log.querySelectorAll('.msg.ai.cursor')){el.classList.remove('cursor');if(el.classList.contains('status')||!el.textContent.trim())el.remove();}
    turnOpen=false;setBusy(false);controller=null;input.focus();
    if(convo&&!sqBusy)startListening();  // nothing left to say (spoken already, error, stop, [silent]): go back to listening
  }
}

// ---- Camera button (Mike 11/4): photos and videos are uploaded to the server on send;
// Claude gets the saved image paths (a video arrives as about one frame per second, no sound). ----
const camBtn=document.getElementById('cam'),camFile=document.getElementById('camFile'),attEl=document.getElementById('att');
let pending=[];
// The camera button opens a small menu: take a photo / record a video (opens the phone camera) / from gallery.
const camMenu=document.getElementById('camMenu');
camBtn.addEventListener('click',e=>{e.stopPropagation();camMenu.hidden=!camMenu.hidden;});
document.addEventListener('click',e=>{if(!camMenu.hidden&&!camMenu.contains(e.target))camMenu.hidden=true;});
camMenu.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;camMenu.hidden=true;document.getElementById(b.dataset.in).click();});
for(const inp of [camFile,document.getElementById('camPhoto'),document.getElementById('camVideo')])
  inp.addEventListener('change',()=>{for(const f of inp.files)if(/^(image|video)\//.test(f.type))pending.push({file:f,url:URL.createObjectURL(f)});inp.value='';drawAtt();});
function drawAtt(){
  attEl.textContent='';
  pending.forEach((a,i)=>{const c=document.createElement('div');c.className='chip';
    const v=a.file.type.startsWith('video/');const m=document.createElement(v?'video':'img');m.src=a.url;if(v){m.muted=true;m.playsInline=true;}
    const x=document.createElement('button');x.type='button';x.textContent='✕';x.title='Remove';
    x.onclick=()=>{URL.revokeObjectURL(a.url);pending.splice(i,1);drawAtt();};
    c.append(m,x);if(v){const t=document.createElement('span');t.className='tag';t.textContent='video';c.append(t);}
    attEl.append(c);});
}
async function uploadPending(){
  const lines=[];
  for(const a of pending){
    const r=await fetch('/upload',{method:'POST',headers:{'Content-Type':a.file.type},body:a.file});
    if(!r.ok)throw new Error('Upload failed ('+r.status+') for '+(a.file.name||'a file'));
    const j=await r.json();
    if(j.kind==='video')lines.push(`[Attached video, ${j.paths.length} frames at about 1 per second, no sound. Read these images in order: ${j.paths.join(' ')}]`);
    else lines.push(`[Attached photo. Read this image: ${j.paths[0]}]`);
  }
  return lines;
}
form.addEventListener('submit',async e=>{e.preventDefault();const t=input.value.trim();if((!t&&!pending.length)||sendBtn.disabled)return;
  if(!pending.length){input.value='';input.style.height='auto';send(t);return;}
  const items=pending;setBusy(true);const note=add('sys','Uploading '+items.length+(items.length>1?' files…':' file…'));
  let lines;try{lines=await uploadPending();}catch(err){note.remove();setBusy(false);add('error',err.message);return;}
  note.remove();setBusy(false);pending=[];drawAtt();input.value='';input.style.height='auto';
  send((t||'What do you see?')+'\n\n'+lines.join('\n'),items);});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,200)+'px';});
stopBtn.addEventListener('click',()=>{if(controller)controller.abort();stopAudio();});
newBtn.addEventListener('click',()=>{closePast();sessionId=null;try{localStorage.removeItem('claude-chat-session')}catch(e){}log.innerHTML='';add('sys','New session.');input.focus();});
// A chat idle for more than STALE_H hours starts fresh on open (Mike 11/4); old chats stay under Past.
const STALE_H=4;
try{const last=+localStorage.getItem('claude-chat-last')||0;
  if(sessionId&&Date.now()-last>STALE_H*3600e3){sessionId=null;localStorage.removeItem('claude-chat-session');}}catch(e){}
if(sessionId) openSession(sessionId);  // after the voice globals above exist
input.focus();
</script>
